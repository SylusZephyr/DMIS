# Alembic: schema migrations for the business database (dip.storage.business).
#   alembic upgrade head                          # DB from DIP_POSTGRES_URL, else data/platform/business.db
#   alembic -x url=sqlite:///tmp/x.db upgrade head
#   alembic revision --autogenerate -m "add foo"  # then review the generated file in alembic/versions/
# See docs/DEPLOYMENT_GUIDE.md, section "Schema migrations".
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
version_path_separator = os
# sqlalchemy.url is resolved in alembic/env.py (-x url=..., else dip.settings.business_url)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
