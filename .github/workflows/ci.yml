name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python — ruff, mypy, pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install (hashed lockfile)
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps -e .
      - name: Lockfiles match pyproject.toml
        run: |
          pip install "uv==0.8.17"
          scripts/lock_deps.sh --check
      - name: ruff
        run: ruff check src tests
      - name: mypy (subset configured in pyproject.toml)
        run: mypy
      - name: pip-audit (known vulnerabilities in the locked dependencies)
        # Blocking. To accept a finding, add `--ignore-vuln <ID>` here with a comment saying why.
        run: |
          pip-audit -r requirements/ci.txt --require-hashes --disable-pip --progress-spinner off
          pip-audit -r requirements/prod.txt --require-hashes --disable-pip --progress-spinner off
      - name: Alembic migrations are in sync with the models (non-blocking)
        continue-on-error: true
        run: |
          alembic -x url=sqlite:///$RUNNER_TEMP/migrations.db upgrade head
          alembic -x url=sqlite:///$RUNNER_TEMP/migrations.db check

  python:
    name: Python — v1 core + engine + platform tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install (hashed lockfile)
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps -e .
      - name: Build the v1 database the integration tests read (rules-only, no API key)
        run: |
          python scripts/init_project.py
          python scripts/run_pipeline.py --category denture_base
      - name: Test
        run: python -m pytest -q

  frontend:
    name: Frontend — lint, typecheck, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run check:i18n
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: npm audit (runtime dependencies, blocking)
        run: npm audit --audit-level=high --omit=dev
      - name: npm audit (all dependencies incl. dev tooling, non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high

  e2e:
    name: Frontend — end-to-end (when frontend defines test:e2e)
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Does the frontend define test:e2e?
        id: has
        run: |
          if node -e "process.exit(require('./frontend/package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json has no test:e2e script yet; skipping"
          fi
      - uses: actions/setup-python@v5
        if: steps.has.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - uses: actions/setup-node@v4
        if: steps.has.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.has.outputs.run == 'true'
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps -e .
          cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Seed the lake and start the API (port 8105)
        if: steps.has.outputs.run == 'true'
        env:
          DIP_DATA_DIR: ${{ runner.temp }}/platform
          DIP_LAKE_DIR: ${{ runner.temp }}/lake
        run: |
          python scripts/init_project.py
          python scripts/dmis.py bootstrap
          nohup python scripts/dmis.py serve --host 127.0.0.1 --port 8105 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8105/api/v2/health >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8105/api/v2/health >/dev/null
      - name: Build and start the web server (port 3105)
        if: steps.has.outputs.run == 'true'
        working-directory: frontend
        env:
          DIP_API_URL: http://127.0.0.1:8105
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          nohup npx next start -p 3105 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3105/ >/dev/null && break; sleep 2; done
      - name: npm run test:e2e
        if: steps.has.outputs.run == 'true'
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3105
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3105
          DIP_API_URL: http://127.0.0.1:8105
        run: npm run test:e2e
      - name: Server logs
        if: failure() && steps.has.outputs.run == 'true'
        run: tail -n 200 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" || true

  # v2 interface (frontend-v2/): the same checks, on its own ports, so both versions stay green side by side
  frontend-v2:
    name: Frontend v2 — lint, typecheck, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run check:i18n
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: npm audit (runtime dependencies, blocking)
        run: npm audit --audit-level=high --omit=dev
      - name: npm audit (all dependencies incl. dev tooling, non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high

  e2e-v2:
    name: Frontend v2 — end-to-end
    runs-on: ubuntu-latest
    needs: [python, frontend-v2]
    steps:
      - uses: actions/checkout@v4
      - name: Does the frontend define test:e2e?
        id: has
        run: |
          if node -e "process.exit(require('./frontend-v2/package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "frontend-v2/package.json has no test:e2e script yet; skipping"
          fi
      - uses: actions/setup-python@v5
        if: steps.has.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - uses: actions/setup-node@v4
        if: steps.has.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - name: Install
        if: steps.has.outputs.run == 'true'
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps -e .
          cd frontend-v2 && npm ci && npx playwright install --with-deps chromium
      - name: Seed the lake and start the API (port 8106)
        if: steps.has.outputs.run == 'true'
        env:
          DIP_DATA_DIR: ${{ runner.temp }}/platform
          DIP_LAKE_DIR: ${{ runner.temp }}/lake
        run: |
          python scripts/init_project.py
          python scripts/dmis.py bootstrap
          nohup python scripts/dmis.py serve --host 127.0.0.1 --port 8106 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8106/api/v2/health >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8106/api/v2/health >/dev/null
      - name: Build and start the web server (port 3106)
        if: steps.has.outputs.run == 'true'
        working-directory: frontend-v2
        env:
          DIP_API_URL: http://127.0.0.1:8106
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          nohup npx next start -p 3106 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3106/ >/dev/null && break; sleep 2; done
      - name: npm run test:e2e
        if: steps.has.outputs.run == 'true'
        working-directory: frontend-v2
        env:
          E2E_BASE_URL: http://127.0.0.1:3106
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3106
          DIP_API_URL: http://127.0.0.1:8106
        run: npm run test:e2e
      - name: Server logs
        if: failure() && steps.has.outputs.run == 'true'
        run: tail -n 200 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" || true

  docker-smoke:
    name: Docker — build and smoke-test the production compose stack
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy pre-flight accepts a generated env file and refuses the shipped example
        run: |
          python3 scripts/deploy.py init --domain dmis.ci-check.dev
          python3 scripts/deploy.py check
          cp infra/prod.env.example infra/prod.env
          if python3 scripts/deploy.py check; then echo "the example env file must be refused"; exit 1; fi
          rm infra/prod.env
      - name: Smoke test (postgres, redis, neo4j, qdrant, api x2 workers, queue worker)
        run: scripts/smoke_docker.sh
      - name: Build the web images (frontend-v2 is the default DMIS_WEB, frontend the alternative)
        run: |
          docker build -t dmis-web-v2 --build-arg DIP_API_URL=http://api:8000 frontend-v2
          docker build -t dmis-web --build-arg DIP_API_URL=http://api:8000 frontend
