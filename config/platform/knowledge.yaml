# Product knowledge layer (spec: AI-Powered Global Dental Product Intelligence, sections 11-14, 19, 67, 89-90, 101).
# Every threshold, weight, term list and attribute schema used by src/dip/knowledge lives here
# (PRINCIPLES.md principle 9). Category-specific attribute schemas are keyed by the category slug used in
# config/categories.yaml; a market without its own schema uses `generic`.

# ---------------------------------------------------------------- Dental Confidence (0-100), spec 11 + 13.1
dental_confidence:
  # spec 11: 0.30 text + 0.25 application + 0.20 image + 0.15 specification + 0.10 industry evidence.
  # A component with no evidence at all is left out and the others are re-weighted, so a missing signal
  # is never counted as "non-dental" (spec 11: low online evidence must not mean non-dental).
  weights:
    text: 0.30
    application: 0.25
    image: 0.20
    specification: 0.15
    industry: 0.10
  # the score is capped when few components carry evidence: one weak signal can't look certain
  cap_by_components: {1: 80, 2: 90}
  bands:              # lower bound (inclusive) -> label, checked top-down
    - [85, strong]
    - [70, probable]
    - [45, review]
    - [20, probably_non_dental]
    - [0, non_dental]
  # text evidence: share of the listing's words that are dental terms vs non-dental terms
  text:
    title_weight: 1.0
    description_weight: 0.5
    category_weight: 1.5     # the marketplace sub-category name is strong evidence
    saturation: 3            # this many independent dental terms => full text score
  # industry evidence: the listing's brand appears in the offline/industry registries (manufacturers,
  # exhibitors, dental distributors) -- data/reference/*.csv when present
  industry_registry_glob: data/reference/dental_brands*.csv

